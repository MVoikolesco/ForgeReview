root = "."
tmp_dir = "tmp/forgereview-air"

[build]
cmd = "CGO_ENABLED=0 go build -o ./tmp/forgereview-air/server ./cmd/server"
bin = "./tmp/forgereview-air/server"

include_ext = ["go", "html", "tmpl", "yaml", "yml", "json"]
exclude_dir = [
  "tmp",
  "vendor",
  "web-admin",
  ".git",
  "data",
  "logs"
]

delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true
