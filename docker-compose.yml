services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FORGEREVIEW_HTTP_ADDR: :8088
      FORGEREVIEW_DATABASE_URL: file:/data/forgereview.db
      FORGEREVIEW_REDIS_URL: redis://redis:6379/0
      FORGEREVIEW_ENCRYPTION_KEY: ${FORGEREVIEW_ENCRYPTION_KEY:?set FORGEREVIEW_ENCRYPTION_KEY in .env}
      FORGEREVIEW_BOOTSTRAP_ADMIN_EMAIL: ${FORGEREVIEW_BOOTSTRAP_ADMIN_EMAIL:?set FORGEREVIEW_BOOTSTRAP_ADMIN_EMAIL in .env}
      FORGEREVIEW_BOOTSTRAP_ADMIN_PASSWORD: ${FORGEREVIEW_BOOTSTRAP_ADMIN_PASSWORD:?set FORGEREVIEW_BOOTSTRAP_ADMIN_PASSWORD in .env}
      FORGEREVIEW_SESSION_SIGNING_KEY: ${FORGEREVIEW_SESSION_SIGNING_KEY:?set FORGEREVIEW_SESSION_SIGNING_KEY in .env}
      FORGEREVIEW_GIN_MODE: ${FORGEREVIEW_GIN_MODE:-release}
      FORGEREVIEW_TRUSTED_PROXIES: ${FORGEREVIEW_TRUSTED_PROXIES:-}
      FORGEREVIEW_CORS_ALLOWED_ORIGINS: ${FORGEREVIEW_CORS_ALLOWED_ORIGINS:-http://localhost:3010}
      FORGEREVIEW_SESSION_COOKIE_SAME_SITE: ${FORGEREVIEW_SESSION_COOKIE_SAME_SITE:-lax}
      FORGEREVIEW_SESSION_COOKIE_SECURE: ${FORGEREVIEW_SESSION_COOKIE_SECURE:-false}
      FORGEREVIEW_LOG_DIR: ${FORGEREVIEW_LOG_DIR:-/app/logs}
    ports:
      - "8088:8088"
    volumes:
      - workflow-data:/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8088
    ports:
      - "3010:3010"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  workflow-data:
  redis-data:
