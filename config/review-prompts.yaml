default:
  partial_prompt: prompts/base/review_partial.md
  final_prompt: prompts/base/review_final.md
  include_docs: false
  doc_file_patterns:
    - "readme"
    - "readme.*"
    - "readme-*"
    - "docs/**"
    - "**/docs/**"
    - "*.md"
    - "*.mdx"
    - "*.rst"
    - "*.adoc"
    - "license"
    - "license.*"
    - "changelog.*"
    - "contributing.*"
    - "code_of_conduct.*"
  ignore_file_patterns:
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "yarn.lock"
    - "go.sum"
    - "composer.lock"
    - "vendor/**"
    - "**/vendor/**"
    - "node_modules/**"
    - "**/node_modules/**"
    - "dist/**"
    - "**/dist/**"
    - "build/**"
    - "**/build/**"
    - "coverage/**"
    - "**/coverage/**"
    - "*.map"
    - "*.min.js"
  force_include_file_patterns:
    - ".env.example"
    - ".gitignore"
    - "Dockerfile"

stacks:
  codeigniter:
    prompt: prompts/stacks/codeigniter.md
    file_patterns:
      - "app/Config/**/*.php"
      - "app/Controllers/**/*.php"
      - "app/Models/**/*.php"
      - "app/Database/Migrations/**/*.php"
      - "app/Entities/**/*.php"
      - "app/Filters/**/*.php"
      - "app/Helpers/**/*.php"
      - "app/Libraries/**/*.php"
      - "app/Services/**/*.php"
      - "app/Views/**/*.php"
      - "spark"

  laravel:
    prompt: prompts/stacks/laravel.md
    file_patterns:
      - "artisan"
      - "app/**/*.php"
      - "bootstrap/app.php"
      - "config/**/*.php"
      - "database/factories/**/*.php"
      - "database/migrations/**/*.php"
      - "database/seeders/**/*.php"
      - "resources/views/**/*.blade.php"
      - "routes/**/*.php"

  php:
    prompt: prompts/stacks/php.md
    file_patterns:
      - "*.php"
      - "composer.json"

  react:
    prompt: prompts/stacks/react.md
    file_patterns:
      - "*.jsx"
      - "*.tsx"
      - "src/**/*.jsx"
      - "src/**/*.tsx"
      - "src/**/*.ts"

  vue:
    prompt: prompts/stacks/vue.md
    file_patterns:
      - "*.vue"
      - "src/**/*.vue"
      - "vite.config.*"
      - "vue.config.*"
      - "nuxt.config.*"

  angular:
    prompt: prompts/stacks/angular.md
    file_patterns:
      - "angular.json"
      - "*.component.ts"
      - "*.component.html"
      - "*.component.scss"
      - "*.directive.ts"
      - "*.guard.ts"
      - "*.module.ts"
      - "*.pipe.ts"
      - "*.resolver.ts"
      - "*.service.ts"
      - "src/app/**/*.ts"
      - "src/app/**/*.html"
      - "src/app/**/*.scss"

  solidjs:
    prompt: prompts/stacks/solidjs.md
    file_patterns:
      - "app.config.*"
      - "src/routes/**/*.tsx"
      - "src/routes/**/*.ts"

  go:
    prompt: prompts/stacks/go.md
    file_patterns:
      - "*.go"
      - "go.mod"

  sql:
    prompt: prompts/stacks/sql.md
    file_patterns:
      - "*.sql"
      - "database/migrations/**/*.php"
      - "app/Database/Migrations/**/*.php"

  docker:
    prompt: prompts/stacks/docker.md
    file_patterns:
      - "Dockerfile"
      - "*.dockerfile"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      - "compose.yml"
      - "compose.yaml"

  cicd:
    prompt: prompts/stacks/cicd.md
    file_patterns:
      - ".gitea/workflows/**/*.yml"
      - ".gitea/workflows/**/*.yaml"
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
