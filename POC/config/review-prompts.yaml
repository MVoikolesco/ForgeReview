prompts:
  technical_review: ../prompts/technical-review.md
  security_performance: ../prompts/security-performance.md
  import_divergence: ../prompts/import-divergence.md
  final_response: ../prompts/final-response.md

filters:
  include_docs: false
  doc_file_patterns:
    - "readme"
    - "readme.*"
    - "readme-*"
    - "docs/**"
    - "**/docs/**"
    - "*.md"
    - "*.mdx"
    - "*.rst"
    - "*.adoc"
    - "license"
    - "license.*"
    - "changelog.*"
    - "contributing.*"
    - "code_of_conduct.*"
  ignore_file_patterns:
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "yarn.lock"
    - "go.sum"
    - "composer.lock"
    - "vendor/**"
    - "**/vendor/**"
    - "node_modules/**"
    - "**/node_modules/**"
    - "dist/**"
    - "**/dist/**"
    - "build/**"
    - "**/build/**"
    - "coverage/**"
    - "**/coverage/**"
    - "*.map"
    - "*.min.js"
  force_include_file_patterns:
    - ".env.example"
    - ".gitignore"
    - "Dockerfile"
